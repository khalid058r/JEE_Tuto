<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core">

<h:head>
    <title>TP JSF - Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { background-color: #f8f9fa; }
        .error-message { list-style-type: none; margin: 0; padding: 0; }
    </style>
</h:head>

<h:body>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="text-center mb-4">
                    <h3 class="text-secondary">Saisie Étudiant</h3>
                </div>

                <h:panelGroup rendered="#{not empty facesContext.messageList}">
                    <div class="alert alert-danger shadow-sm">
                        <h:messages styleClass="error-message"/>
                    </div>
                </h:panelGroup>

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h:form>

                            <div class="mb-3">
                                <h:outputLabel value="CNE" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{etudiant.cne}" required="true"
                                             requiredMessage="Le CNE est obligatoire"
                                             styleClass="form-control">
                                    <f:validateLength minimum="6" />
                                </h:inputText>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel value="Nom" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{etudiant.nom}" required="true"
                                             styleClass="form-control"/>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel value="Prénom" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{etudiant.prenom}" required="true"
                                             styleClass="form-control"/>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel value="Ville" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{etudiant.ville}" required="true"
                                             styleClass="form-control">
                                    <f:validateLength maximum="10"/>
                                </h:inputText>
                            </div>

                            <div class="mb-3">
                                <h:outputLabel value="Date Naissance (MM/dd/yyyy)" styleClass="form-label fw-bold"/>
                                <h:inputText value="#{etudiant.dateNaissance}" required="true"
                                             styleClass="form-control" placeholder="ex: 12/25/2000">
                                    <f:convertDateTime pattern="MM/dd/yyyy"/>
                                </h:inputText>
                            </div>

                            <div class="mb-4">
                                <h:outputLabel value="Bourse" styleClass="form-label fw-bold"/>
                                <div class="input-group">
                                    <h:inputText value="#{etudiant.bourse}" required="true"
                                                 styleClass="form-control">
                                        <f:validateLongRange minimum="700" maximum="1000"/>
                                    </h:inputText>
                                    <span class="input-group-text">DH</span>
                                </div>
                                <small class="text-muted">Entre 700 et 1000 DH</small>
                            </div>

                            <div class="d-grid">
                                <h:commandButton value="Valider" action="#{etudiant.enregistrer}"
                                                 styleClass="btn btn-primary btn-lg"/>
                            </div>

                        </h:form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</h:body>
</html>
