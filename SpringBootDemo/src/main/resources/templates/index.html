<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clients</title>
</head>
<body>

<form th:action="@{/saveClient}" method="post">
    <input name="nom" placeholder="Nom"/>
    <input name="prenom" placeholder="Prenom"/>
    <input name="age" type="number"/>
    <input name="ville" placeholder="Ville"/>
    <button type="submit">Save</button>
</form>

<hr/>
<h2>Liste des Clients</h2>

<table border="1">
    <tr>
        <th>Code</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Ville</th>
        <th>Action</th>
    </tr>

    <tr th:each="c : ${clients}">
        <td th:text="${c.code}"></td>
        <td th:text="${c.nom}"></td>
        <td th:text="${c.prenom}"></td>
        <td th:text="${c.ville}"></td>
        <td>
            <a th:href="@{/deleteClient(code=${c.code})}">Delete</a>
        </td>
    </tr>

</table>

</body>
</html>
